[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundx"
version = "0.1.0"
description = "Advanced fundamental analysis CLI tool for stocks"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "plotext>=5.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yfinance>=0.2.36",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
fundx = "fundx.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fundx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
